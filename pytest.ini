[pytest]
testpaths = tests
markers =
    online: chama a API real (rode com: pytest -m online)
addopts = -ra
# API descontinuada usada pelo NOSSO script vira erro: é o aviso de que uma versão futura vai quebrar a skill.
filterwarnings =
    error::DeprecationWarning:tg_extract
    error::FutureWarning:tg_extract
